
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servicios ofrecidos</title>

   <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="perfil-cuidador.css">
</head>

<body>
<main class="woofly-profile-wrapper">
      <div class="woofly-container">
        <nav class="woofly-breadcrumb" aria-label="Ruta de navegación">
          <a href="encontrar.html" class="woofly-breadcrumb__link">Encontrar cuidador</a>
          <span class="woofly-breadcrumb__separator" aria-hidden="true">&gt;</span>
          <span class="woofly-breadcrumb__current">Perfil de Lucía Fernández</span>
        </nav>

        <section class="caregiver-header" aria-labelledby="caregiver-name">
          <div class="caregiver-header__avatar-box">
            <img
              src="lucia-fernandez.png"
              alt="Foto de perfil de Lucía Fernández"
              class="caregiver-header__avatar"
            />
          </div>

          <div class="caregiver-header__info">
            <h1 id="caregiver-name" class="caregiver-header__name">Lucía Fernández</h1>

            <p class="caregiver-header__subtitle">
              <span>Paseadora y cuidadora</span>
              <span class="caregiver-header__dot" aria-hidden="true">&middot;</span>
              <span>Cochabamba, Bolivia</span>
            </p>

            <div class="caregiver-header__meta">
              <div class="caregiver-header__rating">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="#F5A623" aria-hidden="true">
                  <path d="M12 2.25c.43 0 .82.24 1.01.62l2.53 5.13 5.66.82c.42.06.77.36.9.76.13.4.02.84-.28 1.14l-4.1 3.99.97 5.64c.07.42-.1.84-.44 1.09-.34.25-.79.28-1.17.08L12 18.86l-5.06 2.66c-.38.2-.83.17-1.17-.08-.34-.25-.51-.67-.44-1.09l.97-5.64-4.1-3.99a1.12 1.12 0 0 1-.28-1.14c.13-.4.48-.7.9-.76l5.66-.82 2.53-5.13c.19-.38.58-.62 1.01-.62z" />
                </svg>
                <span class="caregiver-header__score">4.9</span>
                <span class="caregiver-header__reviews">&middot; 128 reseñas</span>
              </div>

              <span class="caregiver-header__verified-badge">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="#35A795" aria-hidden="true">
                  <path d="M12 1.5l2.35 1.54 2.8-.18 1.24 2.51 2.51 1.24-.18 2.8L22.26 12l-1.54 2.35.18 2.8-2.51 1.24-1.24 2.51-2.8-.18L12 22.26l-2.35-1.54-2.8.18-1.24-2.51-2.51-1.24.18-2.8L1.74 12l1.54-2.35-.18-2.8 2.51-1.24 1.24-2.51 2.8.18L12 1.5zm-1.15 13.78l5.3-5.3-1.41-1.42-3.89 3.89-1.79-1.79-1.41 1.41 3.2 3.21z" />
                </svg>
                Verificada
              </span>
            </div>

            <ul class="caregiver-header__services" aria-label="Servicios ofrecidos">
              <li class="caregiver-header__service-tag">Paseo</li>
              <li class="caregiver-header__service-tag">Cuidado en casa</li>
              <li class="caregiver-header__service-tag">Visitas</li>
            </ul>
          </div>
        </section>
      </div>
    </main>
    <!-- SECCIÓN 21: SERVICIOS OFRECIDOS -->
    <section id="w21">

        <div class="w21-card">

            <div class="w21-cabecera">
                <h1>Servicios ofrecidos</h1>

                <button class="w21-btn w21-btn-sec" type="button" id="w21-abrir">
                    ✏️ Editar
                </button>
            </div>

            <ul class="w21-servicios" id="w21-servicios"></ul>

        </div>

        <dialog id="w21-ventana" aria-labelledby="w21-titulo-ventana">

            <div class="w21-modal">

                <div class="w21-modal-cab">
                    <h2 id="w21-titulo-ventana">Editar servicios</h2>

                    <button class="w21-btn w21-btn-sec w21-cerrar"
                            type="button"
                            id="w21-cerrar"
                            aria-label="Cerrar">
                        ✕
                    </button>
                </div>

                <form class="w21-formulario" id="w21-formulario" novalidate>

                    <label class="w21-campo">
                        Icono
                        <select id="w21-icono">
                            <option>🐾</option>
                            <option>🏠</option>
                            <option>❤️</option>
                            <option>🦮</option>
                            <option>🐕</option>
                            <option>🐈</option>
                            <option>🛁</option>
                            <option>✂️</option>
                            <option>🚗</option>
                            <option>🩺</option>
                        </select>
                    </label>

                    <label class="w21-campo w21-nombre-campo">
                        Nombre del servicio
                        <input id="w21-nombre" type="text" maxlength="40"
                               placeholder="Ej.: Baño y corte">
                    </label>

                    <label class="w21-campo">
                        Precio (Bs)
                        <input id="w21-precio" type="number" min="0"
                               step="any" placeholder="0">
                    </label>

                    <label class="w21-campo">
                        Cobro
                        <select id="w21-unidad">
                            <option value="">Por servicio</option>
                            <option value="/día">Por día</option>
                            <option value="/hora">Por hora</option>
                        </select>
                    </label>

                    <p class="w21-error" id="w21-error" role="alert"></p>

                    <div class="w21-acciones">
                        <button class="w21-btn" type="submit" id="w21-guardar">
                            Añadir servicio
                        </button>

                        <button class="w21-btn w21-btn-sec"
                                type="button" id="w21-cancelar" hidden>
                            Cancelar edición
                        </button>
                    </div>

                </form>

                <ul class="w21-lista" id="w21-lista"></ul>

                <div class="w21-modal-pie">
                    <button class="w21-btn w21-btn-sec w21-pequeno"
                            type="button" id="w21-restaurar">
                        Restaurar servicios iniciales
                    </button>

                    <button class="w21-btn" type="button" id="w21-listo">
                        Listo
                    </button>
                </div>

            </div>
        </dialog>

    </section>

   <script src="js/script.js"></script>

</body>
</html>
