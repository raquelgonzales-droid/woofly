<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Woofly</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- W1: MENÚ DE NAVEGACIÓN -->
    <header id="w1" class="header">
        <nav class="navbar">

            <!-- LOGO -->
            <div class="logo">
               <img src="logo-woofly.png" alt="Logo Woofly">
            </div>

            <!-- MENÚ DE NAVEGACIÓN -->
            <ul class="nav-links">
                <li><a href="#w1">Inicio</a></li>
                <li><a href="#w13">Encontrar cuidador</a></li>
                <li><a href="#w7">Servicios</a></li>
                <li><a href="#w37">Cómo funciona</a></li>
                <li><a href="#w49">Ser cuidador</a></li>
                <li><a href="#">Ayuda</a></li>
            </ul>

            <!-- BOTONES -->
            <div class="nav-buttons">
                <a href="#" class="btn-login">Iniciar sesión</a>
                <a href="#" class="btn-register">Registrarme</a>
            </div>

        </nav>
    </header>

    <main>

        <!-- W7: SERVICIO DE PASEO -->
        <section id="w7" class="servicio-paseo">
            <div class="tarjeta-paseo">

                <img src="perro-paseo.png" alt="Perro disfrutando de un paseo">

                <div class="contenido-paseo">
                    <h2>Paseo</h2>

                    <p>
                        Un paseo para mantenerlo activo y feliz.
                    </p>

                    <a href="#w13" class="btn-paseador">
                        Buscar paseador
                    </a>
                </div>

            </div>
        </section>

        <!-- W13: PERFIL DE CUIDADOR 2 -->
        <section id="w13">
            <article class="w13-tarjeta">
                <img src="carlos-ramirez.png" alt="Foto de perfil de Carlos Ramírez" class="w13-foto">

                <h3 class="w13-nombre">Carlos Ramírez</h3>

                <p class="w13-servicio">Cuidado en casa</p>

                <p class="w13-ubicacion">La paz,Bolivia</p>

                <div class="w13-calificacion">
                    <span class="w13-estrella" aria-hidden="true">★</span>
                    <span class="w13-puntaje">4.8</span>
                    <span class="w13-resenas">· 96 reseñas</span>
                </div>

                <p class="w13-precio">Desde 80 BS / día</p>

                <a href="#" class="w13-btn">Ver perfil</a>
            </article>
        </section>

        <!-- W19: PRESENTACIÓN -->
        <section id="w19"></section>

        <!-- W25: RESEÑAS DE OTRAS FAMILIAS -->
        <section id="w25"></section>

        <!-- W31: MAPA DE UBICACIÓN -->
        <section id="w31"></section>

        <!-- W37: PASO 03 - RESERVA -->
        <section id="w37"></section>

        <!-- W43: SERVICIO DE VISITAS -->
        <section id="w43"></section>

        <!-- W49: BENEFICIO: CONECTA CON DUEÑOS -->
        <section id="w49"></section>

    </main>

</body>
</html>
